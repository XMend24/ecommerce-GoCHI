<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G☆CHI - Carrito</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">G☆CHI</h1>
            </header>
            <nav>
                <ul>
                    <li><a class="boton-menu boton-volver" href="./index.html"><i class="bi bi-arrow-left-circle"></i> Volver a la tienda</a></li>
                    <li><a class="boton-menu boton-carrito active" href="./carrito.html"><i class="bi bi-cart-fill"></i> Carrito</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <h2 class="titulo-principal">Carrito</h2>
            
            <div id="contenedor-carrito" class="contenedor-carrito">
                <p class="carrito-vacio">Cargando carrito... <i class="bi bi-hourglass-split"></i></p>
            </div>

            <div class="carrito-acciones">
                <div class="carrito-acciones-izquierda">
                    <button class="carrito-acciones-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
                </div>
                <div class="carrito-acciones-derecha">
                    <div class="carrito-acciones-total">
                        <p>Total:</p>
                        <p id="total">$0</p>
                    </div>
                    <button onclick="abrirCheckout()" class="btn-comprar">Comprar Ahora</button>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-pago" class="modal" style="display: none;">
    <div class="modal-content auth-card">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h2 style="color: var(--gold-accent);">Confirmar Transferencia</h2>
        <p>Por favor, ingresa los datos de tu pago para procesar el pedido.</p>
        
        <form id="form-checkout" onsubmit="confirmarCompra(event)">
            <div class="input-group">
                <label>Nombre del Titular</label>
                <input type="text" id="nombre-confirm" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="input-group">
                <label>Teléfono de Contacto</label>
                <input type="tel" id="tel-confirm" placeholder="0412-0000000" required>
            </div>
            <div class="input-group">
                <label>Dirección de Envío</label>
                <input type="text" id="dir-confirm" placeholder="Ciudad, Sector, Calle..." required>
            </div>
            <div class="input-group">
                <label>Banco de Origen</label>
                <select id="banco-confirm" required style="width: 100%; padding: 10px; border-radius: 5px;">
                    <option value="Banesco">Banesco</option>
                    <option value="Mercantil">Mercantil</option>
                    <option value="BDV">Banco de Venezuela</option>
                    <option value="Pago Movil">Pago Móvil / Otro</option>
                </select>
            </div>
            <div class="input-group">
                <label>N° de Referencia (Últimos 6-8 dígitos)</label>
                <input type="text" id="ref-confirm" placeholder="123456" required>
            </div>
            
            <p>Total a Reportar: <span id="monto-final" style="font-weight: bold; color: var(--gold-accent);"></span></p>
            
            <button type="submit" class="btn-auth" style="background-color: var(--gold-accent); margin-top: 15px;">
                Enviar Confirmación
            </button>
        </form>
    </div>
</div>

    <script src="./js/carrito.js"></script>
</body>
</html>
